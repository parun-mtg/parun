name: Pages
# Deploys a published release's web client to GitHub Pages: the bytes of its
# Wasm asset, not a rebuild.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: The release to deploy, like v1.2.3.
        required: true
        type: string
concurrency:
  group: pages
permissions:
  contents: read
jobs:
  # Uploading and deploying in separate jobs, as GitHub's starter workflow does:
  # deploy-pages run in the uploading job did not see the artifact.
  upload:
    name: Upload
    # A prerelease leaves the page on the latest release.
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh release download "$TAG" --pattern 'parun-*-wasm.tar.gz' --repo "$GITHUB_REPOSITORY"
          tar --extract --gzip --file parun-*-wasm.tar.gz
          mv parun-*-wasm/web web
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
  deploy:
    name: Deploy
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
