name: Build
# The downloadable builds, shared by Nightly and Release: the binaries, the
# sdist, the schemas, the Wasm build and the web client, each uploaded as a
# workflow artifact named NAME-PLATFORM.
on:
  workflow_call:
    inputs:
      name:
        description: The artifact name prefix.
        required: true
        type: string
      ref:
        description: The commit to build.
        required: true
        type: string
      test:
        description: Whether to run the test suite on each platform.
        default: true
        type: boolean
env:
  # Track the GHC that nixpkgs' default package set uses.
  GHC: 9.10.3
jobs:
  # GHC from ghcup rather than Nix, whose binaries load their libraries from
  # /nix/store: these are the binaries a user downloads. Haskell libraries link
  # statically (cabal.project); only the system's C libraries stay dynamic.
  # Linux builds in the static job instead.
  portable:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - id: haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ env.GHC }}
          cabal-update: false
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.haskell.outputs.ghc-version }}-${{ inputs.ref }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ steps.haskell.outputs.ghc-version }}-
      - run: cabal configure --enable-optimization --flags=pedantic --jobs --semaphore
      - run: cabal build all
      - if: inputs.test
        run: cabal run parun -- test --timeout=120s
      - run: mkdir artifact
      - run: cp "$(cabal list-bin -v0 parun)" artifact
        shell: bash
      # Tarred so the executable bit survives the upload's zip.
      - run: tar --create --file artifact.tar --verbose artifact
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}-${{ runner.os }}-${{ runner.arch }}
          path: artifact.tar
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ steps.cache.outputs.cache-primary-key }}
  # Linux links fully statically, against musl in an Alpine GHC image: glibc
  # does not link statically, and ghcup's GHC loads libgmp dynamically. The
  # empty cabal config names no package repository, which every dependency
  # shipping with GHC allows.
  static:
    name: Build ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - run: >-
          echo "MUSL=docker run --rm --env CABAL_CONFIG=/dev/null
          --volume $PWD:$PWD --workdir $PWD
          quay.io/benz0li/ghc-musl:$GHC" >> "$GITHUB_ENV"
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: dist-newstyle
          key: ${{ runner.os }}-${{ runner.arch }}-musl-${{ env.GHC }}-${{ inputs.ref }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-musl-${{ env.GHC }}-
      - run: $MUSL cabal configure --enable-executable-static --enable-optimization --flags=pedantic --jobs --semaphore
      - run: $MUSL cabal build all
      - if: inputs.test
        run: $MUSL cabal run parun -- test --timeout=120s
      - run: mkdir artifact
      - run: cp "$($MUSL cabal list-bin -v0 parun)" artifact
      # ldd exits nonzero on a binary that loads no shared library.
      - run: "! ldd artifact/parun"
      # Platform-independent, so built once. A downloaded binary finds the data
      # through the parun_datadir variable, the sdist's data directory.
      - run: |
          $MUSL cabal sdist --output-directory artifact
          artifact/parun schema > artifact/schema.json
          artifact/parun schema scenario > artifact/scenario-schema.json
      # Tarred so the executable bit survives the upload's zip.
      - run: tar --create --file artifact.tar --verbose artifact
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}-${{ runner.os }}-${{ runner.arch }}
          path: artifact.tar
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: dist-newstyle
          key: ${{ steps.cache.outputs.cache-primary-key }}
  # The web client (#8007) ready to serve, and the WASI command-line build.
  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: nixbuild/nix-quick-install-action@v35
      # Optimized, unlike CI's Wasm job, so it keeps a cache of its own.
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: dist-wasm
          key: wasm-optimized-${{ hashFiles('flake.lock') }}-${{ inputs.ref }}
          restore-keys: wasm-optimized-${{ hashFiles('flake.lock') }}-
      - run: nix develop .#wasm --command script/build-web.sh artifact/web
      - run: |
          nix develop .#wasm --command wasm32-wasi-cabal build exe:parun \
            --builddir=dist-wasm \
            --enable-optimization \
            --flags=pedantic \
            --project-file=cabal.wasm.project
          cp "$(nix develop .#wasm --command wasm32-wasi-cabal list-bin -v0 exe:parun \
            --builddir=dist-wasm \
            --enable-optimization \
            --flags=pedantic \
            --project-file=cabal.wasm.project)" artifact/parun.wasm
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: dist-wasm
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - run: tar --create --file artifact.tar --verbose artifact
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}-wasm
          path: artifact.tar
