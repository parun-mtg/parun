name: Nightly
on:
  schedule:
    - cron: 0 9 * * *
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: max-jobs = auto
      - run: nix build --print-build-logs
      - run: nix build --print-build-logs --out-link benchmark .#benchmark
      - run: cp benchmark/bench.json .
      - uses: actions/upload-artifact@v7
        with:
          name: parun-${{ github.sha }}-bench
          path: bench.json
  # Nix covers Linux only, so the other platforms get GHC from ghcup.
  portable:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: haskell
        uses: haskell-actions/setup@v2
        with:
          # Track the GHC that nixpkgs' default package set uses.
          ghc-version: 9.10.3
          cabal-update: false
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.haskell.outputs.ghc-version }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ steps.haskell.outputs.ghc-version }}-
      - run: cabal configure --flags=pedantic --jobs --semaphore
      - run: cabal build all
      - run: cabal run parun -- test --timeout=120s
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ steps.cache.outputs.cache-primary-key }}
  rules:
    name: Rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - run: script/check-rules.sh
        env:
          GH_TOKEN: ${{ github.token }}
