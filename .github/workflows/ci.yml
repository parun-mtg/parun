name: CI
on:
  merge_group:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/cabal
            ~/.local/state/cabal
            dist-newstyle
          key: cabal-${{ hashFiles('flake.lock') }}-${{ github.sha }}
          restore-keys: cabal-${{ hashFiles('flake.lock') }}-
      - run: nix develop .#ci --command cabal update
      - run: |
          nix develop .#ci --command cabal configure \
            --disable-executable-dynamic \
            --disable-shared \
            --flags=pedantic \
            --ghc-options='+RTS -A64m -RTS' \
            --jobs \
            --semaphore
      - run: nix develop .#ci --command cabal build all
      # A push to main is a commit the queue already tested; it only feeds the cache.
      - if: github.event_name != 'push'
        run: nix develop .#ci --command cabal run parun -- test --timeout=120s
      # A cache saved from a queue's temporary ref could never be restored.
      - if: github.event_name != 'merge_group' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/cabal
            ~/.local/state/cabal
            dist-newstyle
          key: ${{ steps.cache.outputs.cache-primary-key }}
  # Nix covers Linux only, so the other platforms get GHC from ghcup.
  portable:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - id: haskell
        uses: haskell-actions/setup@v2
        with:
          # Track the GHC that nixpkgs' default package set uses.
          ghc-version: 9.10.3
      - id: cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.haskell.outputs.ghc-version }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ steps.haskell.outputs.ghc-version }}-
      - run: cabal update
      - run: cabal configure --flags=pedantic --jobs --semaphore
      - run: cabal build all
      - if: github.event_name != 'push'
        run: cabal run parun -- test --timeout=120s
      - if: github.event_name != 'merge_group' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ steps.cache.outputs.cache-primary-key }}
  cabal:
    name: Cabal
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.cabal
  gild:
    name: Gild
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.gild
  hlint:
    name: HLint
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.hlint
  nixfmt:
    name: Nixfmt
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.nixfmt
  ormolu:
    name: Ormolu
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
      - run: nix build --print-build-logs .#checks.x86_64-linux.ormolu
