<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#15171c" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Parun</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon.png">
    <link rel="manifest" href="./manifest.webmanifest">
    <!-- The settings before first paint: those saved from the settings menu
         (page.js), else the system's theme, normal cards and full motion. -->
    <script>
      document.documentElement.dataset.theme = localStorage.getItem("parun-theme") ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.density = localStorage.getItem("parun-density") ?? "normal";
      document.documentElement.dataset.motion = localStorage.getItem("parun-motion") ?? "full";
    </script>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./page.js"></script>
  </head>

    <p id="insecure" hidden>This page is not a secure context, so Safari runs the engine many times slower. Load it over https or from localhost (script/serve-web.sh).</p>
    <div id="app"><div class="splash"><img class="logo" src="./icon.svg" alt="" width="72" height="72"><h1>Parun</h1><div class="spinner" aria-hidden="true"></div><p class="phase" id="phase">Loading the engine…</p></div></div>
    <div class="chrome">
      <button type="button" id="settings-button" aria-label="Settings" aria-haspopup="true" aria-expanded="false" aria-controls="settings">&#9881;&#xFE0E;</button>
      <div id="settings" role="dialog" aria-label="Settings" hidden>
        <fieldset><legend>Theme</legend>
          <label><input type="radio" name="theme" value="system"> System</label>
          <label><input type="radio" name="theme" value="light"> Light</label>
          <label><input type="radio" name="theme" value="dark"> Dark</label>
        </fieldset>
        <fieldset><legend>Card size</legend>
          <label><input type="radio" name="density" value="compact"> Compact</label>
          <label><input type="radio" name="density" value="normal"> Normal</label>
          <label><input type="radio" name="density" value="large"> Large</label>
        </fieldset>
        <fieldset><legend>Motion</legend>
          <label><input type="radio" name="motion" value="full"> Full</label>
          <label><input type="radio" name="motion" value="reduced"> Reduced</label>
        </fieldset>
        <fieldset><legend>Notify when it's your turn</legend>
          <label><input type="radio" name="notify" value="off"> Off</label>
          <label><input type="radio" name="notify" value="on"> On</label>
        </fieldset>
        <p class="about">Parun <span title="@COMMIT@">@VERSION@</span> · <a href="https://github.com/parun-mtg/parun" target="_blank" rel="noopener">GitHub</a></p>
      </div>
    </div>
    <footer class="diagnostics"><small id="timings"></small> <small id="response"></small></footer>
    <details hidden><summary>Trace</summary><pre id="trace"></pre></details>
